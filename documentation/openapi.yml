openapi: 3.0.0
info:
  title: User Appointment Management System API
  description: API for managing users and their appointments. Allows for user registration, profile management, and appointment scheduling with timezone validation for invitees.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local development server

# ===============================================================
# Reusable Components (Schemas, Responses, etc.)
# ===============================================================
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user.
          example: "67e69f45e8869b2518e34d16"
        name:
          type: string
          description: The full name of the user.
          example: "Alice"
        username:
          type: string
          description: The unique username for login.
          example: "alice"
        preferred_timezone:
          type: string
          description: The user's preferred IANA timezone name.
          example: "Asia/Jakarta"

    AppointmentResponse:
      type: object
      properties:
        appointment_id:
          type: string
          description: The unique identifier for the appointment.
          example: "67e6a033e8869b2518e34d21"
        title:
          type: string
          description: The title of the appointment.
          example: "Project Kickoff"
        start_time_local:
          type: string
          description: The start time converted to the logged-in user's preferred timezone.
          example: "Mon, 29 Sep 2025 10:00:00 WIB"
        end_time_local:
          type: string
          description: The end time converted to the logged-in user's preferred timezone.
          example: "Mon, 29 Sep 2025 11:00:00 WIB"

    Error:
      type: object
      properties:
        error:
          type: string
          description: A description of the error that occurred.

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Enter your JWT token in the format: Bearer {token}"

# ===============================================================
# API Paths and Endpoints
# ===============================================================
paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login or Initiate Signup
      description: Authenticates a user with their username. If the user exists, it returns a JWT. If not, it returns a 404 with an instruction for the client to redirect to the signup flow.
      requestBody:
        description: The username of the user to log in.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "new_user"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not found"
                  action:
                    type: string
                    example: "redirect_to_signup"

  /signup:
    post:
      tags:
        - Authentication
      summary: Register a New User
      description: Creates a new user profile based on the signup form and returns a JWT to log them in.
      requestBody:
        description: The details for the new user profile.
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, name, preferred_timezone]
              properties:
                username:
                  type: string
                  example: "new_user"
                name:
                  type: string
                  example: "New User"
                preferred_timezone:
                  type: string
                  example: "Europe/London"
      responses:
        "201":
          description: Signup successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "409":
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Username already exists"

  /api/profile:
    get:
      tags:
        - User Profile
      summary: Get My Profile
      description: Fetches the profile of the currently authenticated user.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The user's profile information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized.
    put:
      tags:
        - User Profile
      summary: Update My Profile
      description: Updates the name and preferred timezone for the currently authenticated user. Returns a new JWT with the updated timezone information.
      security:
        - BearerAuth: []
      requestBody:
        description: The fields to update.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Alice Updated"
                preferred_timezone:
                  type: string
                  example: "America/New_York"
      responses:
        "200":
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Profile updated successfully"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Unauthorized.

  /api/users:
    get:
      tags:
        - Users
      summary: Get All Users
      description: Retrieves a list of all users in the system, which can be used to populate the 'invite' list on the frontend.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A list of all user objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized.

  /api/appointments:
    get:
      tags:
        - Appointments
      summary: Get My Upcoming Appointments
      description: Retrieves a list of appointments for the authenticated user where the start time is in the future.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A list of upcoming appointments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: Unauthorized.
    post:
      tags:
        - Appointments
      summary: Create a New Appointment
      description: Creates a new appointment. The creator is automatically added as a participant. Working hour validation (08:00-17:00) is applied to all invitees based on their preferred timezone.
      security:
        - BearerAuth: []
      requestBody:
        description: The details of the appointment to create.
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start_time, end_time]
              properties:
                title:
                  type: string
                  description: The title of the appointment.
                  example: "Final Project Review"
                start_time:
                  type: string
                  format: date-time
                  description: The start time in UTC ISO 8601 format.
                  example: "2025-11-15T14:00:00Z"
                end_time:
                  type: string
                  format: date-time
                  description: The end time in UTC ISO 8601 format.
                  example: "2025-11-15T15:30:00Z"
                participant_ids:
                  type: array
                  description: A list of user IDs to invite (optional).
                  items:
                    type: string
                  example: ["67e69f45e8869b2518e34d17"]
      responses:
        "201": 
          description: Appointment created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Appointment created successfully!"
                  id:
                    type: string
                    example: "67e6a033e8869b2518e34d21"
        "400":
          description: Bad request. Could be due to invalid time format, end time being before start time, or a working-hour conflict for an invitee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Appointment is outside of working hours (08:00-17:00) for user: bob"
        "401":
          description: Unauthorized.
