<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Your Profile</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>
    <div class="container">
        <h1>Complete Your Profile</h1>
        <p>Welcome! Please complete your details to finish signing up.</p>
        
        <div id="signup-form">
            <label>Username:</label>
            <input type="text" id="signup-username" readonly>
            
            <label>Full Name:</label>
            <input type="text" id="signup-name" placeholder="Enter your full name">
            
            <label>Preferred Timezone:</label>
            <select id="signup-timezone">
                <option value="UTC">UTC</option>
                <option value="Asia/Jakarta">Asia/Jakarta (WIB)</option>
                <option value="Europe/London">Europe/London (GMT)</option>
                <option value="America/New_York">America/New_York (EST)</option>
                <option value="Pacific/Auckland">Pacific/Auckland</option>
            </select>
            
            <button class="btn" onclick="signup()">Finish Signup</button>
            <p id="signup-message" style="color: red;"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const username = params.get('username');
            if (username) {
                document.getElementById('signup-username').value = username;
            }
        });

        async function signup() {
            const username = document.getElementById('signup-username').value;
            const name = document.getElementById('signup-name').value;
            const preferred_timezone = document.getElementById('signup-timezone').value;
            const signupMessage = document.getElementById('signup-message');

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, name, preferred_timezone })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/public/dashboard.html';
                } else {
                    signupMessage.textContent = `Error: ${data.error}`;
                }
            } catch (error) {
                signupMessage.textContent = 'A network error occurred.';
            }
        }
    </script>
</body>
</html>
